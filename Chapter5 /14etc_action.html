<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>14etc_action</title>
    <style>
        h1:hover{color:red;}
        h2:active{color:blue;}

        /* input태그가 사용 가능할 때 background-color속성에 burlywood키워드를 적용함.*/
        input:enbled{background-color:burlywood;}
        /* input태그가 사용 불가능할 때 background-color속성에 brown키워드 적용*/
        input:disabled{background-color:brown;}
        /* input태그에 포커스를 맞출 때 background-color속성에 antiquewhite키워드 적용*/
        input:focus{background-color:antiquewhite;}
    </style>
</head>
<body>
    <h2>5.1 반응 선택지</h2>
    <h2>5.2 상태 선택자</h2>
    <hr>

    <h1>반응 선택자</h1>
    <hr>

    <h2>사용 가능</h2>
    <input>
    <h2>사용 불가능</h2>
    <input disabled="disabled">
</body>
</html>
